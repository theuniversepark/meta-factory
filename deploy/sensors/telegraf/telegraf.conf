# Telegraf — 공장 UNS(MQTT)의 센서 묶음을 풀어 TimescaleDB에 적재
[agent]
  interval = "1s"
  flush_interval = "1s"
  precision = "1us"

# 묶음: metafactory/sensors/v1/{zone}/{cell}  →  readings[] 한 줄씩 (ts = 공장 기준 시계 µs)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["metafactory/sensors/v1/+/+"]
  qos = 0
  client_id = "telegraf-sensor-ingest"
  data_format = "json_v2"
  name_override = "sensor_reading"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "metafactory/sensors/v1/+/+"
    tags = "_/_/_/zone/cell"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "readings"
      timestamp_key = "ts"
      timestamp_format = "unix_us"
      tags = ["s", "m", "u"]
      included_keys = ["v", "e", "ts", "s", "m", "u"]

[[outputs.postgresql]]
  connection = "host=timescaledb user=sensors password=${SENSOR_DB_PASSWORD} dbname=sensors sslmode=disable"
  # 표는 init.sql이 미리 만든다 (하이퍼테이블) — Telegraf는 행만 넣는다
  tags_as_foreign_keys = false
  create_templates = []
  add_column_templates = []
