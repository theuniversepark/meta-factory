# 공장 중앙 UNS 브로커 — 존 서버(존 브로커)가 브리지로 metafactory/sensors/v1/# 를 올린다
listener 1883
persistence true
persistence_location /mosquitto/data/
# 운영: 인증·TLS 필수 (password_file · cafile/certfile/keyfile) — 시험 환경만 익명 허용
allow_anonymous true
# 존 서버 쪽 mosquitto.conf 예시 (존 브로커 → 공장 중앙 브리지):
#   connection factory-uns
#   address <공장 중앙 IP>:1883
#   topic metafactory/sensors/v1/# out 0
#   cleansession false
#   queue_qos0_messages true      # 공장 중앙이 끊겨도 존 서버가 쌓아 두었다가 전달 (store-and-forward)
