# 공장 중앙 서버 — PTP Grandmaster (linuxptp ptp4l) · GNSS/NTP로 맞춘 시스템 시계를 PHC에 반영(phc2sys)
#   ptp4l -f ptp4l-grandmaster.conf -i <NIC>   ·   phc2sys -s CLOCK_REALTIME -c <NIC> -O 0
[global]
priority1               10
priority2               10
domainNumber            24
clockClass              6
time_stamping           hardware
delay_mechanism         E2E
logSyncInterval         0
