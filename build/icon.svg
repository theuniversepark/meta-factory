<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#14806f"/>
      <stop offset="0.55" stop-color="#0b4f48"/>
      <stop offset="1" stop-color="#062b29"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- digital-twin grid floor -->
  <g stroke="#5eead4" stroke-opacity="0.28" stroke-width="3" fill="none">
    <path d="M190 700 H834"/><path d="M170 745 H854"/>
    <path d="M300 700 L260 745"/><path d="M420 700 L400 745"/><path d="M512 700 V745"/>
    <path d="M604 700 L624 745"/><path d="M724 700 L764 745"/>
  </g>
  <g filter="url(#sh)">
    <!-- chimney -->
    <rect x="690" y="250" width="58" height="200" rx="6" fill="url(#wall)"/>
    <rect x="682" y="240" width="74" height="22" rx="6" fill="#fff1c9"/>
    <!-- factory body with sawtooth roof -->
    <path d="M250 700 V430 L370 360 V430 L490 360 V430 L610 360 V430 L774 430 V700 Z" fill="url(#wall)"/>
    <!-- roof glass -->
    <path d="M250 430 L370 360 V430 Z M370 430 L490 360 V430 Z M490 430 L610 360 V430 Z" fill="url(#roof)" opacity="0.9"/>
  </g>
  <!-- windows (lit, cyan = digital) -->
  <g fill="#0b4f48">
    <rect x="290" y="480" width="80" height="60" rx="8"/>
    <rect x="400" y="480" width="80" height="60" rx="8"/>
    <rect x="510" y="480" width="80" height="60" rx="8"/>
    <rect x="620" y="480" width="110" height="60" rx="8"/>
    <rect x="460" y="590" width="104" height="110" rx="8"/>
  </g>
  <g fill="#5eead4">
    <rect x="300" y="490" width="60" height="40" rx="5"/>
    <rect x="410" y="490" width="60" height="40" rx="5"/>
    <rect x="520" y="490" width="60" height="40" rx="5"/>
    <rect x="630" y="490" width="90" height="40" rx="5"/>
  </g>
  <g stroke="#0b4f48" stroke-width="6"><path d="M512 590 V700"/></g>
  <!-- data node / connection -->
  <g stroke="#5eead4" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M719 240 C719 210 735 200 760 200"/>
  </g>
  <circle cx="778" cy="200" r="20" fill="#5eead4"/>
  <circle cx="778" cy="200" r="32" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="5"/>
  <text x="512" y="850" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="1" fill="#ecfdf5">META-FACTORY</text>
</svg>
