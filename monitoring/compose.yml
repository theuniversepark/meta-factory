# 메타팩토리 설비 대시보드 (4단계) — 앱 MQTT 브로커 → Telegraf(MIT) → InfluxDB 2(MIT) → Grafana OSS(AGPL-3.0, 수정 없이 별도 서비스)
# 앱 「데이터 연동 → 📈 설비 대시보드 → 대시보드 켜기」가 이 폴더를 데이터 폴더(monitoring/)로 복사하고 .env(무작위 토큰·비밀번호)를 만든 뒤
#   docker compose -p metafactory-mon up -d 로 띄운다. 접속 포트는 이 PC 안(127.0.0.1)에서만 연다.
# 컨테이너 → 앱 브로커: host.docker.internal(host-gateway) — 브로커를 사내망에 열지 않는다 (Docker Desktop · Colima 공통)
services:
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    ports: ["127.0.0.1:${MF_INFLUX_PORT:-8186}:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: metafactory
      DOCKER_INFLUXDB_INIT_PASSWORD: ${MF_INFLUX_PASSWORD:?}
      DOCKER_INFLUXDB_INIT_ORG: metafactory
      DOCKER_INFLUXDB_INIT_BUCKET: raw
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${MF_INFLUX_TOKEN:?}
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influxdb/init:/docker-entrypoint-initdb.d:ro
  telegraf:
    image: telegraf:1.34
    restart: unless-stopped
    depends_on: [influxdb]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MF_MQTT_URL: tcp://host.docker.internal:${MF_MQTT_PORT:-1885}
      MF_INFLUX_TOKEN: ${MF_INFLUX_TOKEN:?}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    depends_on: [influxdb]
    ports: ["127.0.0.1:${MF_GRAFANA_PORT:-3300}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${MF_GRAFANA_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "true"            # 이 PC 안에서만 열리므로 보기 전용은 로그인 없이
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/mf-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"     # 외부 사용 통계 전송 끔
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      MF_INFLUX_TOKEN: ${MF_INFLUX_TOKEN:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  influx-data: {}
  grafana-data: {}
