      path = "phase"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "v"
      disable_prepend_keys = true

# ⑥-3 CMM 소재별 측정 기록 (온도 보정 · 파지 · 리워크) — metafactory/cmm/v1/adapt/{셀}/part
