# ⑥-4 적응가공 소재 식별셀 스캔 부스 — metafactory/matl/v1/adapt/{셀} (부스 조도 · 스캐너 온도 · 소재 무게 · 스캔 커버리지 · LIBS 신뢰도 · 프로브 힘 · 단계)
