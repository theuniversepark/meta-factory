# 앱 MQTT 브로커(UNS) → InfluxDB — 수신 시각을 시계열 시각으로 쓴다 (시뮬레이션 기준 시계는 과거 날짜에서 배속으로 흐르므로 실시간 대시보드에는 수신 시각이 맞다)
[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${MF_INFLUX_TOKEN}"
  organization = "metafactory"
  bucket = "raw"

# ① 설비 상태 요약 — metafactory/telemetry/v1/{존}/{설비}
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/telemetry/v1/+/+"]
  client_id = "mf-telegraf-telemetry"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "equipment"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "asset"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "zone"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "name"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "health"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rul_min"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk10"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cpk"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "util"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "busy"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "down"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "string"

# ② 환경·설비 센서 묶음 — metafactory/sensors/v1/{존}/{셀} (readings[] 한 줄 = 센서 측정값 하나)
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/sensors/v1/+/+"]
  client_id = "mf-telegraf-sensors"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensor"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "zone"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "cell"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "readings"
      tags = ["s", "m", "u"]
      included_keys = ["s", "m", "u", "v"]
      disable_prepend_keys = true
      [inputs.mqtt_consumer.json_v2.object.fields]
        v = "float"

# ③ 적응가공 가공기 상태 감시 — metafactory/machmon/v1/adapt/{셀} (이상 점수 · RUL · 공구 · 측정값)
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/machmon/v1/adapt/+"]
  client_id = "mf-telegraf-machmon"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "machine"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "asset"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "anomaly"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rul.min"
      rename = "rul_tool_min"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rul.parts"
      rename = "rul_tool_parts"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rul.spindleMin"
      rename = "rul_spindle_min"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tool.wear"
      rename = "tool_wear"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "decision"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "v"
      disable_prepend_keys = true

# ④ 운영 이벤트 (경보 · 주의 · 조치) — metafactory/events/v1/{수준} → 그래프 위 이벤트 표시
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/events/v1/+"]
  client_id = "mf-telegraf-events"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "event"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "level"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "zone"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "title"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "text"
      type = "string"
      optional = true

# ⑤ Zone 운영 분석 — metafactory/oee/v1/{존} (OEE · 가동률 · 성능 · 품질 · 진행률 · 6대 손실 분)
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/oee/v1/+"]
  client_id = "mf-telegraf-oee"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "oee"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["zone"]
      disable_prepend_keys = true

# ⑥ 품질 표본 — metafactory/quality/v1/{존} (제품 1개 = 1점: 공정 변수 x_* · 품질 특성 y_* · NG 여부 · NG 유형) → 관리도 · 산점도 · NG 파레토
[[inputs.mqtt_consumer]]
  servers = ["${MF_MQTT_URL}"]
  topics = ["metafactory/quality/v1/+"]
  client_id = "mf-telegraf-quality"
  qos = 0
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "quality"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["zone", "product", "kind"]
      excluded_keys = ["id"]
      disable_prepend_keys = true
      [inputs.mqtt_consumer.json_v2.object.fields]
        ng = "int"
