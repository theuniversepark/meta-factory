apiVersion: 1
datasources:
  - name: 메타팩토리 InfluxDB
    uid: mf-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: metafactory
      defaultBucket: raw
    secureJsonData:
      token: ${MF_INFLUX_TOKEN}
